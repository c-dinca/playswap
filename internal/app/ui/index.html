<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlaySwap</title>
<style>/*@CSS*/</style>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand" aria-label="PlaySwap">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="12.5" cy="16" r="8.5" fill="var(--p1)"/>
        <circle cx="19.5" cy="16" r="8.5" fill="var(--p2)" style="mix-blend-mode:screen"/>
      </svg>
      <span>PlaySwap</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-action="nav" data-view="games">Games</button>
      <button class="tab" role="tab" data-action="nav" data-view="players">Players</button>
      <button class="tab" role="tab" data-action="nav" data-view="settings">Settings</button>
    </nav>
    <div id="now" class="now" aria-live="polite"></div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>/*@JS*/</script>
</body>
</html>
