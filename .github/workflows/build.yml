name: Build

# Every push and pull request: run the tests and build both .exe files.
# A pushed tag like v1.2.0: also publish a GitHub release with the .exe files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PlaySwap
          path: |
            dist/PlaySwap-Setup.exe
            dist/PlaySwap.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PlaySwap-Setup.exe
            dist/PlaySwap.exe
          generate_release_notes: true
